name: build-tlm-native
# Build the tlm native mod bundle against THIS checkout (the fork's own source, including
# the Chinese localization and the Bedrock model/animation engine changes) using the same
# native_build.sh the release uses. Bypasses the request/VM/publish machinery of native-mods.yml,
# whose tools/ checkout layout breaks tools/ci/rustup_install.sh on this fork.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NATIVE_CACHE: ${{ github.workspace }}/../native-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install build-tools, platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Install Rust for Android and cargo-ndk
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Make room for the build
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"

      - name: Build tlm bundle with the fork's game source
        env:
          NATIVE_LIBRARY_ONLY: '1'
        run: |
          cp -r native-mods/tlm/mixins/tlm /tmp/tlm-bundle
          bash packaging/android/native_build.sh . out /tmp/tlm-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: tlm-native-build
          path: |
            out/libhorizon_android.so
            out/build.json
          if-no-files-found: error
