[mod]
id = "tlm"
version = "0.1.0"
# Minimal pipeline-validation bundle: a row in Options > Mods.

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "tlm_runtime"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
